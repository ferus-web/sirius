[package]
name = "sirius"
description = "A tiny, experimental web engine"
version = "0.1.0"
license = "BSD-3-Clause"
kind = "Binary"
backend = "C"
binaries = ["balde", "sirius"]

[toolchain]
version = "2.2.0"

[dependencies]
pixie = ">= 6.1.0"
url = ">= 0.1.8"
chame = ">= 1.0.5"
shakar = ">= 0.1.3"
"gh:planetis-m/vulkan" = ">= 1.4.344"
results = ">= 0.5.1"
surfer = ">= 0.2.5"
xkb = ">= 1.4.1"
curly = ">= 1.1.1"
bumpy = ">= 1.1.3"
pretty = ">= 0.2.0"
chronicles = ">= 0.12.3"
vmath = ">= 3.0.0"
stylus = ">= 0.1.4"
nanovg = ">= 0.3.4"
chroma = ">= 1.0.0"

[platforms.native]
include = ["vulkan", "wayland-egl", "libcurl", "fontconfig", "wayland-client", "wayland-egl-backend", "glesv2", "egl", "simdutf"]
link = ["vulkan", "wayland-egl", "libcurl", "fontconfig", "wayland-client", "wayland-egl-backend", "glesv2", "egl", "simdutf"]
