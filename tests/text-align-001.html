<!DOCTYPE html>
<html>
  <head>
    <title>Text Alignment 001</title>
    <style>
#start { text-align: start; }
#left { text-align: left; }
#right { text-align: right; }
#end { text-align: end; }
#center { text-align: center; }
    </style>
  </head>
  <body>
    <p id="start">This should be aligned to the start</p>
    <p id="left">This should be aligned to the left</p>
    <p id="end">This should be aligned to the end</p>
    <p id="right">This should be aligned to the right</p>
    <p id="center">This should be aligned to the center</p>
  </body>
</html>
