<!DOCTYPE html>
<html>
  <head><title>setInterval() example</title></head>
  <body>
    <p id="greet">Hello task queue!</p>
    <script>
	let elem = document.getElementById("greet");

	function randomText() {
	  let time = new Date();
	  elem.textContent = time;
	}
	
	randomText();
	setInterval(randomText, 1000);
    </script>
  </body>
</html>
