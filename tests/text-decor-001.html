<!DOCTYPE html>
<html>
  <head>
    <title>Text Decoration 001</title>
    <style>
#strikeoff { text-decoration: line-through; }
#overline { text-decoration: overline; }
#underline { text-decoration: underline; }
#none { text-decoration: none; } /* NOTE: Not really required, but hey, it doesn't hurt to test it. */
    </style>
  </head>
  <body>
    <p id="strikeoff">This should have a line going through it</p>
    <p id="overline">This should have a line over it</p>
    <p id="underline">This should have a line under it</p>
    <p id="none">This should have no text decoration</p>
  </body>
</html>
