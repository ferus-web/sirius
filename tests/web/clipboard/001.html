<!DOCTYPE html>
<html>
  <head><title>Clipboard 001</title></head>
  <body>
    <p id="out">Click here to write to the clipboard!!! :D</p>

    <script>
const out = document.getElementById('out');

function afterClipboardWrite() {
  console.log("afterClipboardWrite() called")
  out.textContent = "Wrote a nice little message to your clipboard :)";
}

out.addEventListener(
  "click",
  function() {
    const result = navigator.clipboard.writeText("hello sirius!");
    result.then(afterClipboardWrite);
    console.log("called writeText()");
  }
)
    </script>
  </body>
</html>
