<!DOCTYPE html>
<html>
  <head><title>Event object</title></head>
  <body>
    <p id="targ">start typing here :3</p>
    <script>
	let elem = document.getElementById("targ");
	let i = 0;
	function x(event) {
	  let res = "";
	  res = res.concat(elem.textContent, event.key);
	  elem.textContent = res;
	}

	elem.onkeydown = x;
    </script>
  </body>
</html>
