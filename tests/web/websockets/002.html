<!DOCTYPE html>
<html>
  <head>
    <title>Premature writes</title>
  </head>
  <body>
  </body>
  <script>
    const n = new WebSocket("wss://echo.websocket.org");
    const body = document.body;
    try {
	n.send("woopsies");
    } catch(exc) {
	console.log("caught DOMException");
	console.log("name: ", exc.name);
	console.log("message: ", exc.message);
	console.log("dom error code: ", exc.code);
	console.log("stack: ", exc.stack);

	const name = document.createElement("p");
	const msg = document.createElement("p");
	const errcode = document.createElement("p");
	const err = document.createElement("p");
	const stack = document.createElement("p");
	const heading = document.createElement("h1");

	heading.textContent = "DOM exception caught (as intended)";
	name.textContent = exc.name;
	errcode.textContent = exc.code;
	msg.textContent = exc.message;
	const x = "Stack: " + exc.stack;
	stack.textContent = x; // TODO: directly assigning the expression to this causes an old parser path to be triggered that's REALLY bad at handling fields

	document.body.appendChild(heading);
	document.body.appendChild(name);
	document.body.appendChild(msg);
	document.body.appendChild(errcode);
	document.body.appendChild(err);
	document.body.appendChild(stack);
    }
  </script>
</html>
