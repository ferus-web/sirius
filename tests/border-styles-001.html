<!DOCTYPE html>
<html>
  <head>
    <style>
      div {
        width: 200px;
        height: 100px;
        margin: 20px;
        background-color: #f0f0f0;
      }
      .solid {
        border: 4px solid #333;
      }
      .dashed {
        border: 4px dashed #ff4500;
      }
      .dotted {
        border: 4px dotted #008000;
      }
    </style>
    <title>Border styles</title>
  </head>
  <body>
    <div class="solid"></div>
    <div class="dashed"></div>
    <div class="dotted"></div>
  </body>
</html>
