<!DOCTYPE html>
<html>
  <head>
    <title>SSL Error</title>

    <style>
.tls-warn {
  color: rgb(255, 255, 255);
}

#error-box {
  background-color: rgb(255, 0, 0);
}

#exception {
  font-family: monospace, fantasy;
}
    </style>
  </head>
  <body>
    <div id="error-box">
      <h1 class="tls-warn">A secure connection to the site could not be established.</h1>
      <h3 class="tls-warn">It likely means that the site is using a certificate which cannot be verified to be safe, either maliciously or on accident.</h3>
      <h6 id="exception">$2</h6>
    </div>

    <footer>Sirius</footer>
  </body>
</html>
