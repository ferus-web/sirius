--path:"./"

--define:chronicles_log_level=INFO
--define:figdrawTextBackend="harfbuzzy"

# --define:baliLogJitDbg
# --define:baliLogVmDbg
# --define:baliLogExecDbg
# --define:baliExplosiveBailouts

-d:adwMinor=9

@if release:
  --passC:"-O3"
  -d:flto
@else:
  --debugger:native
  --passC:"-g3"
  --passC:"-fmax-errors=0"
@end

@if gcc:
  # HACK: just to make sirius compile via gcc
  --passC:"-Wno-error=incompatible-pointer-types"
@end

@if windows:
  --undef:unix
  --undef:posix
  --undef:linux

  --gcc.exe:"x86_64-w64-mingw32-gcc"
  --gcc.linkerexe:"x86_64-w64-mingw32-gcc"

  --passL:"$CROSS_LDFLAGS"
@end
